<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Real process-loopback bridge</title>
        <style>
            body { font: 14px system-ui; margin: 20px; background: #f5f5f5; }
            #sources { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; margin: 16px 0; }
            .source { background: white; border: 1px solid #aaa; padding: 8px; text-align: left; }
            .source img { width: 100%; height: 120px; object-fit: contain; background: #222; }
            video { width: 640px; max-width: 100%; background: #111; display: block; }
            pre { white-space: pre-wrap; }
        </style>
    </head>
    <body>
        <h1>Real process-loopback bridge</h1>
        <button id="start">Start screen share</button><button id="stop" disabled>Stop</button>
        <div id="picker" hidden><h2>Choose a window or screen</h2><div id="sources"></div><button id="cancel">Cancel</button></div>
        <video id="video" autoplay muted></video>
        <pre id="status">Idle</pre>
        <script type="module" src="real-consumer.js"></script>
    </body>
</html>
