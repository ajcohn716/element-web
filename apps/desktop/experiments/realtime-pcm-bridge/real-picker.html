<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Choose what to share</title>
        <style>
            body {
                font: 14px system-ui;
                margin: 16px;
                background: #f5f5f5;
            }
            #sources {
                display: grid;
                grid-template-columns: repeat(3, 1fr);
                gap: 10px;
            }
            button {
                padding: 8px;
            }
            .source {
                background: white;
                border: 1px solid #888;
                text-align: left;
            }
            img {
                width: 100%;
                height: 110px;
                object-fit: contain;
                background: #222;
            }
            span {
                display: block;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }
        </style>
    </head>
    <body>
        <h1>Choose a window or screen</h1>
        <div id="sources"></div>
        <p><button id="cancel">Cancel</button></p>
        <script type="module" src="real-picker.js"></script>
    </body>
</html>
